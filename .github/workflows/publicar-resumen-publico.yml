name: Publicar resumen público agregado

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/publicar-resumen-publico.yml
      - index.html
      - resumen-publico.html
      - resumen-publico.js
      - analizador-de-encuestas.html
      - app.js
      - logo.js
      - styles.css
      - scripts/**
      - requirements-public-summary.txt
      - tests/**
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  preparar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Descargar el sitio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencia del lector XLSX
        run: python -m pip install -r requirements-public-summary.txt

      - name: Probar el agregado y las protecciones de privacidad
        run: python -m unittest discover -s tests -v

      - name: Descargar y validar el Excel desde OneDrive
        shell: bash
        env:
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          DRIVE_ID: ${{ secrets.DRIVE_ID }}
          FILE_ID: ${{ secrets.FILE_ID }}
        run: |
          set -euo pipefail

          ASSERTION=$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api%3A%2F%2FAzureADTokenExchange" \
            | jq -er '.value')
          echo "::add-mask::$ASSERTION"

          RESPONSE=$(curl -fsS \
            -X POST \
            "https://login.microsoftonline.com/${TENANT_ID}/oauth2/v2.0/token" \
            --data-urlencode "client_id=${CLIENT_ID}" \
            --data-urlencode "scope=https://graph.microsoft.com/.default" \
            --data-urlencode "grant_type=client_credentials" \
            --data-urlencode "client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer" \
            --data-urlencode "client_assertion=${ASSERTION}")
          ACCESS_TOKEN=$(echo "$RESPONSE" | jq -er '.access_token')
          echo "::add-mask::$ACCESS_TOKEN"

          test -n "$DRIVE_ID"
          test -n "$FILE_ID"
          BASE_URL="https://graph.microsoft.com/v1.0/drives/${DRIVE_ID}/items/${FILE_ID}"
          curl -fsSL --retry 3 \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            "${BASE_URL}/content" \
            -o "$RUNNER_TEMP/consolidado.xlsx"

          python - "$RUNNER_TEMP/consolidado.xlsx" <<'PY'
          import os
          import sys
          import zipfile

          path = sys.argv[1]
          with zipfile.ZipFile(path) as workbook:
              required = {"[Content_Types].xml", "xl/workbook.xml"}
              if not required.issubset(workbook.namelist()):
                  raise ValueError("El archivo descargado no es un libro XLSX válido.")
          if os.path.getsize(path) == 0:
              raise ValueError("El Excel descargado está vacío.")
          print(f"Excel XLSX validado ({os.path.getsize(path)} bytes).")
          PY

      - name: Generar el resumen sin datos individuales
        run: |
          python scripts/build_public_summary.py \
            "$RUNNER_TEMP/consolidado.xlsx" \
            "$RUNNER_TEMP/resumen-publico.json"
          rm -f "$RUNNER_TEMP/consolidado.xlsx"

      - name: Preparar el sitio público
        run: |
          mkdir -p _site/data
          cp index.html resumen-publico.html resumen-publico.js \
            analizador-de-encuestas.html app.js logo.js styles.css _site/
          cp "$RUNNER_TEMP/resumen-publico.json" _site/data/resumen-publico.json

      - name: Subir artefacto de GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  publicar:
    needs: preparar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publicar el resumen agregado
        id: deployment
        uses: actions/deploy-pages@v4
