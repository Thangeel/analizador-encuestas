

name: Verificar automatizacion de encuestas

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest

    steps:
      - name: Autenticar y verificar lectura del Excel
        shell: bash
        env:
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          DRIVE_ID: ${{ secrets.DRIVE_ID }}
          FILE_ID: ${{ secrets.FILE_ID }}

        run: |
          set -euo pipefail

          ASSERTION=$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api%3A%2F%2FAzureADTokenExchange" \
            | jq -er '.value')

          echo "::add-mask::$ASSERTION"

          RESPONSE=$(curl -fsS \
            -X POST \
            "https://login.microsoftonline.com/${TENANT_ID}/oauth2/v2.0/token" \
            --data-urlencode "client_id=${CLIENT_ID}" \
            --data-urlencode "scope=https://graph.microsoft.com/.default" \
            --data-urlencode "grant_type=client_credentials" \
            --data-urlencode "client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer" \
            --data-urlencode "client_assertion=${ASSERTION}")

          ACCESS_TOKEN=$(echo "$RESPONSE" | jq -er '.access_token')

          echo "::add-mask::$ACCESS_TOKEN"

          echo "Autenticacion con Microsoft Entra exitosa"

          test -n "$DRIVE_ID"
          test -n "$FILE_ID"

          BASE_URL="https://graph.microsoft.com/v1.0/drives/${DRIVE_ID}/items/${FILE_ID}"

          echo "Verificando acceso al Excel..."

          HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            "${BASE_URL}?\$select=id")

          echo "Respuesta HTTP de Microsoft Graph: ${HTTP_CODE}"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: No se pudo acceder al Excel."
            exit 1
          fi

          echo "EXITO: Acceso al archivo confirmado."

          echo "Verificando descarga del contenido..."

          TEMP_FILE=$(mktemp)
          trap 'rm -f "$TEMP_FILE"' EXIT

          curl -fsSL \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            "${BASE_URL}/content" \
            -o "$TEMP_FILE"

          test -s "$TEMP_FILE"

          python3 - "$TEMP_FILE" <<'PY'
          import sys
          import zipfile
          import os

          path = sys.argv[1]

          with zipfile.ZipFile(path) as workbook:
              required = {"[Content_Types].xml", "xl/workbook.xml"}
              if not required.issubset(workbook.namelist()):
                  raise ValueError("El archivo no es un Excel XLSX valido")

          print("EXITO: Archivo Excel descargado correctamente.")
          print("Formato XLSX verificado.")
          print(f"Tamano del archivo: {os.path.getsize(path)} bytes.")
          PY

          rm -f "$TEMP_FILE"

          echo "Archivo temporal eliminado."
          echo "PRUEBA COMPLETADA CORRECTAMENTE."
